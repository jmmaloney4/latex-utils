name: nix flake update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # runs weekly on Sunday at 00:00
permissions:
  contents: write
  pull-requests: write
jobs:
  nix-flake-update:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@f02139a6c0edb4442190a4738c42ccceceb3f6a8 # main
        with:
          branch: nix-flake-update
          commit-msg: nix flake update
          pr-title: "nix flake update"
          pr-assignees: jmmaloney4
